name: Publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/monkfish1337/serioussportsync-scraper

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: docker build --tag serioussportsync-scraper:verify .

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the exact published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run -d --name serioussportsync-scraper-smoke \
            -e SCRAPER_AUTH_TOKEN=ci-only-scraper-token \
            -p 127.0.0.1:18080:8080 \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"
          status=starting
          for attempt in $(seq 1 30); do
            status="$(docker inspect serioussportsync-scraper-smoke \
              --format '{{.State.Health.Status}}')"
            echo "Scraper health: $status"
            if [[ "$status" == "healthy" || "$status" == "unhealthy" ]]; then break; fi
            sleep 2
          done
          [[ "$status" == "healthy" ]]
          curl --fail --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:18080/health

      - name: Show smoke-test logs on failure
        if: failure()
        run: docker logs serioussportsync-scraper-smoke

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force serioussportsync-scraper-smoke 2>/dev/null || true
